<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WonderSearch</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.4; }
    h1 { margin-bottom: 0.3rem; }
    form { display: flex; gap: 0.5rem; margin: 1rem 0; }
    input { flex: 1; padding: 0.6rem; font-size: 1rem; }
    button { padding: 0.6rem 1rem; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin: 0 0 0.8rem; border: 1px solid #ddd; border-radius: 8px; padding: 0.8rem; }
    .result-title { font-size: 1.05rem; font-weight: bold; color: #0b57d0; text-decoration: none; }
    .result-url { display: block; color: #2f7d32; font-size: 0.85rem; margin-top: 0.2rem; word-break: break-all; }
    .result-text { margin: 0.45rem 0 0; color: #333; }
    .status { color: #666; margin-bottom: 0.7rem; }
  </style>
</head>
<body>
  <h1>WonderSearch</h1>
  <p>Eine einfache Suchseite, die Ergebnisse direkt auf der Seite anzeigt.</p>
  <form id="search-form">
    <input id="query" type="search" placeholder="Suchbegriff eingeben…" required>
    <button type="submit">Suchen</button>
  </form>

  <h2>Ergebnisse</h2>
  <p id="status" class="status"></p>
  <ul id="results"></ul>

  <script>
    const searchForm = document.getElementById("search-form");
    const queryInput = document.getElementById("query");
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    const extractRelatedTopics = (topics, collected = []) => {
      topics.forEach((topic) => {
        if (topic.FirstURL && topic.Text) {
          collected.push({ url: topic.FirstURL, text: topic.Text });
        }
        if (Array.isArray(topic.Topics)) {
          extractRelatedTopics(topic.Topics, collected);
        }
      });
      return collected;
    };

    searchForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = queryInput.value.trim();
      if (!query) {
        return;
      }
      results.innerHTML = "";
      status.textContent = "Suche läuft…";

      try {
        const encodedQuery = encodeURIComponent(query);
        const response = await fetch(`https://api.duckduckgo.com/?q=${encodedQuery}&format=json&no_html=1&skip_disambig=1`);
        if (!response.ok) {
          throw new Error("Fehler bei der Suche.");
        }

        const data = await response.json();
        const instantResults = Array.isArray(data.Results)
          ? data.Results.map((result) => ({
            url: result.FirstURL,
            text: result.Text
          }))
          : [];
        const relatedResults = Array.isArray(data.RelatedTopics) ? extractRelatedTopics(data.RelatedTopics) : [];
        const mergedResults = [...instantResults, ...relatedResults].filter((item) => item.url && item.text);
        const uniqueResults = Array.from(
          new Map(mergedResults.map((item) => [item.url, item])).values()
        );

        if (uniqueResults.length === 0) {
          status.textContent = `Keine direkten Ergebnisse für "${query}" gefunden.`;
          return;
        }

        status.textContent = `${uniqueResults.length} Ergebnisse für "${query}"`;

        uniqueResults.forEach((entry) => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = entry.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.className = "result-title";
          link.textContent = entry.text;

          const urlLine = document.createElement("span");
          urlLine.className = "result-url";
          urlLine.textContent = entry.url;

          item.appendChild(link);
          item.appendChild(urlLine);
          results.appendChild(item);
        });
      } catch (error) {
        status.textContent = "Suche fehlgeschlagen. Bitte erneut versuchen.";
        const item = document.createElement("li");
        item.textContent = "Es konnten keine Ergebnisse geladen werden.";
        results.appendChild(item);
      }
    });
  </script>
</body>
</html>
